<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Pong - 1 Joueur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #game {
      position: relative;
      width: 800px;
      height: 400px;
      background-color: #222;
      border: 2px solid white;
      overflow: hidden;
    }
    .paddle {
      position: absolute;
      width: 10px;
      height: 100px;
      background-color: white;
    }
    #paddle-left { left: 10px; }
    #paddle-right { right: 10px; }
    #ball {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: white;
      border-radius: 50%;
    }
    #score {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 42px;
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: #aaa;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="score">0 - 0</div>
    <div id="paddle-left" class="paddle"></div>
    <div id="paddle-right" class="paddle"></div>
    <div id="ball"></div>
    <div id="instructions">↑ Flèche haut / ↓ Flèche bas</div>
  </div>

  <script>
    const ball = document.getElementById("ball");
    const paddleLeft = document.getElementById("paddle-left");
    const paddleRight = document.getElementById("paddle-right");
    const scoreElement = document.getElementById("score");

    let ballPosX = 400;
    let ballPosY = 200;
    let ballDirectionX = 4;
    let ballDirectionY = 3;

    let paddleLeftPosY = 150;
    let paddleRightPosY = 150;

    const paddleHeight = 100;
    const paddleSpeed = 8;
    let leftScore = 0;
    let rightScore = 0;

    const gameWidth = 800;
    const gameHeight = 400;

    // Contrôle clavier (seulement les flèches)
    let keys = {};

    function updateScore() {
      scoreElement.textContent = `${leftScore} - ${rightScore}`;
    }

    function resetBall() {
      ballPosX = gameWidth / 2;
      ballPosY = gameHeight / 2;
      ballDirectionX = (Math.random() > 0.5 ? 4 : -4);
      ballDirectionY = (Math.random() * 4 - 2);
    }

    function updateBall() {
      ballPosX += ballDirectionX;
      ballPosY += ballDirectionY;

      if (ballPosY <= 0 || ballPosY >= gameHeight - 15) {
        ballDirectionY = -ballDirectionY;
      }

      // Collision raquette gauche (joueur)
      if (ballPosX <= 25 &&
          ballPosY + 15 >= paddleLeftPosY &&
          ballPosY <= paddleLeftPosY + paddleHeight) {
        ballDirectionX = Math.abs(ballDirectionX) + 0.3;
      }

      // Collision raquette droite (IA)
      if (ballPosX >= gameWidth - 35 &&
          ballPosY + 15 >= paddleRightPosY &&
          ballPosY <= paddleRightPosY + paddleHeight) {
        ballDirectionX = -Math.abs(ballDirectionX) - 0.3;
      }

      if (ballPosX <= 0) {
        rightScore++;
        updateScore();
        resetBall();
      }
      if (ballPosX >= gameWidth) {
        leftScore++;
        updateScore();
        resetBall();
      }

      ball.style.left = `${ballPosX}px`;
      ball.style.top = `${ballPosY}px`;
    }

    // IA pour la raquette droite
    function moveAIPaddle(currentY, targetY) {
      if (currentY + paddleHeight/2 < targetY) {
        return Math.min(currentY + paddleSpeed, gameHeight - paddleHeight);
      } else if (currentY + paddleHeight/2 > targetY) {
        return Math.max(currentY - paddleSpeed, 0);
      }
      return currentY;
    }

    function updatePaddles() {
      // Joueur - seulement flèches haut et bas
      if (keys['ArrowUp']) {
        paddleLeftPosY = Math.max(paddleLeftPosY - paddleSpeed, 0);
      }
      if (keys['ArrowDown']) {
        paddleLeftPosY = Math.min(paddleLeftPosY + paddleSpeed, gameHeight - paddleHeight);
      }

      // IA - raquette droite
      paddleRightPosY = moveAIPaddle(paddleRightPosY, ballPosY + 7.5);

      paddleLeft.style.top = `${paddleLeftPosY}px`;
      paddleRight.style.top = `${paddleRightPosY}px`;
    }

    function gameLoop() {
      updateBall();
      updatePaddles();
      requestAnimationFrame(gameLoop);
    }

    // Contrôles
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Démarrage
    paddleLeft.style.top = `${paddleLeftPosY}px`;
    paddleRight.style.top = `${paddleRightPosY}px`;
    updateScore();
    resetBall();
    gameLoop();
  </script>
</body>
</html>
