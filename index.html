<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Pong - Automático</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
    }
    #game {
      position: relative;
      width: 800px;
      height: 400px;
      background-color: #222;
      border: 2px solid white;
      overflow: hidden;
    }
    .paddle {
      position: absolute;
      width: 10px;
      height: 100px;
      background-color: white;
    }
    #paddle-left  { left: 0; }
    #paddle-right { right: 0; }
    #ball {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: white;
      border-radius: 50%;
    }
    #score {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 32px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="score">0 - 0</div>
    <div id="paddle-left" class="paddle"></div>
    <div id="paddle-right" class="paddle"></div>
    <div id="ball"></div>
  </div>

  <script>
    const ball = document.getElementById("ball");
    const paddleLeft = document.getElementById("paddle-left");
    const paddleRight = document.getElementById("paddle-right");
    const scoreElement = document.getElementById("score");

    let ballPosX = 400;
    let ballPosY = 200;
    let ballDirectionX = 3;
    let ballDirectionY = 2;

    let paddleLeftPosY = 150;
    let paddleRightPosY = 150;
    const paddleHeight = 100;
    const paddleSpeed = 4;        // vitesse de l'IA (augmente pour plus de difficulté)

    let leftScore = 0;
    let rightScore = 0;
    const gameWidth = 800;
    const gameHeight = 400;

    function updateScore() {
      scoreElement.textContent = `${leftScore} - ${rightScore}`;
    }

    function resetBall() {
      ballPosX = gameWidth / 2;
      ballPosY = gameHeight / 2;
      ballDirectionX = (Math.random() > 0.5 ? 3 : -3);
      ballDirectionY = (Math.random() * 4 - 2); // direction Y aléatoire
    }

    function updateBall() {
      ballPosX += ballDirectionX;
      ballPosY += ballDirectionY;

      // Rebond haut / bas
      if (ballPosY <= 0 || ballPosY >= gameHeight - 15) {
        ballDirectionY = -ballDirectionY;
      }

      // Collision raquette gauche
      if (
        ballPosX <= 15 &&
        ballPosY + 15 >= paddleLeftPosY &&
        ballPosY <= paddleLeftPosY + paddleHeight
      ) {
        ballDirectionX = Math.abs(ballDirectionX); // va vers la droite
      }

      // Collision raquette droite
      if (
        ballPosX >= gameWidth - 30 &&
        ballPosY + 15 >= paddleRightPosY &&
        ballPosY <= paddleRightPosY + paddleHeight
      ) {
        ballDirectionX = -Math.abs(ballDirectionX); // va vers la gauche
      }

      // Point marqué
      if (ballPosX <= 0) {
        rightScore++;
        updateScore();
        resetBall();
      }
      if (ballPosX >= gameWidth) {
        leftScore++;
        updateScore();
        resetBall();
      }

      ball.style.left = `${ballPosX}px`;
      ball.style.top  = `${ballPosY}px`;
    }

    function aiPaddle(paddlePosY, targetY) {
      if (paddlePosY + paddleHeight/2 < targetY) {
        return Math.min(paddlePosY + paddleSpeed, gameHeight - paddleHeight);
      } else if (paddlePosY + paddleHeight/2 > targetY) {
        return Math.max(paddlePosY - paddleSpeed, 0);
      }
      return paddlePosY;
    }

    function updatePaddles() {
      // IA Raquette Gauche (suit la balle)
      paddleLeftPosY = aiPaddle(paddleLeftPosY, ballPosY + 7.5);
      
      // IA Raquette Droite (suit la balle)
      paddleRightPosY = aiPaddle(paddleRightPosY, ballPosY + 7.5);

      paddleLeft.style.top  = `${paddleLeftPosY}px`;
      paddleRight.style.top = `${paddleRightPosY}px`;
    }

    function gameLoop() {
      updateBall();
      updatePaddles();
      requestAnimationFrame(gameLoop);
    }

    // Initialisation
    resetBall();
    updateScore();
    gameLoop();
  </script>
</body>
</html>
