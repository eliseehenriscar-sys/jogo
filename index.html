<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo Pong - Automático</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
    }
    #game {
      position: relative;
      width: 800px;
      height: 400px;
      background-color: #222;
      border: 2px solid white;
      overflow: hidden;
    }
    .paddle {
      position: absolute;
      width: 10px;
      height: 100px;
      background-color: white;
    }
    #paddle-left  { left: 10px; }
    #paddle-right { right: 10px; }
    #ball {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: white;
      border-radius: 50%;
      left: 392.5px;
      top: 192.5px;
    }
    #score {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 42px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="score">0 - 0</div>
    <div id="paddle-left" class="paddle"></div>
    <div id="paddle-right" class="paddle"></div>
    <div id="ball"></div>
  </div>

  <script>
    const ball = document.getElementById("ball");
    const paddleLeft = document.getElementById("paddle-left");
    const paddleRight = document.getElementById("paddle-right");
    const scoreElement = document.getElementById("score");

    let ballPosX = 392.5;
    let ballPosY = 192.5;
    let ballDirectionX = 4;
    let ballDirectionY = 3;

    let paddleLeftPosY = 150;
    let paddleRightPosY = 150;

    const paddleHeight = 100;
    const paddleSpeed = 5;        // Augmente pour IA plus forte
    let leftScore = 0;
    let rightScore = 0;
    const gameWidth = 800;
    const gameHeight = 400;

    function updateScore() {
      scoreElement.textContent = `${leftScore} - ${rightScore}`;
    }

    function resetBall() {
      ballPosX = gameWidth / 2 - 7.5;
      ballPosY = gameHeight / 2 - 7.5;
      ballDirectionX = (Math.random() > 0.5 ? 4 : -4);
      ballDirectionY = (Math.random() * 5 - 2.5);
    }

    function updateBall() {
      ballPosX += ballDirectionX;
      ballPosY += ballDirectionY;

      // Rebond murs haut/bas
      if (ballPosY <= 0 || ballPosY >= gameHeight - 15) {
        ballDirectionY = -ballDirectionY;
      }

      // Collision raquette gauche
      if (ballPosX <= 25 &&
          ballPosY + 15 >= paddleLeftPosY &&
          ballPosY <= paddleLeftPosY + paddleHeight) {
        ballDirectionX = Math.abs(ballDirectionX) + 0.2; // petit boost
      }

      // Collision raquette droite
      if (ballPosX >= gameWidth - 35 &&
          ballPosY + 15 >= paddleRightPosY &&
          ballPosY <= paddleRightPosY + paddleHeight) {
        ballDirectionX = -Math.abs(ballDirectionX) - 0.2;
      }

      // Point marqué
      if (ballPosX <= 0) {
        rightScore++;
        updateScore();
        resetBall();
      }
      if (ballPosX >= gameWidth) {
        leftScore++;
        updateScore();
        resetBall();
      }

      ball.style.left = `${ballPosX}px`;
      ball.style.top  = `${ballPosY}px`;
    }

    function aiPaddle(currentY, targetY) {
      const center = currentY + paddleHeight / 2;
      if (center < targetY - 5) {
        return Math.min(currentY + paddleSpeed, gameHeight - paddleHeight);
      } else if (center > targetY + 5) {
        return Math.max(currentY - paddleSpeed, 0);
      }
      return currentY;
    }

    function updatePaddles() {
      paddleLeftPosY = aiPaddle(paddleLeftPosY, ballPosY + 7.5);
      paddleRightPosY = aiPaddle(paddleRightPosY, ballPosY + 7.5);

      paddleLeft.style.top  = `${paddleLeftPosY}px`;
      paddleRight.style.top = `${paddleRightPosY}px`;
    }

    function gameLoop() {
      updateBall();
      updatePaddles();
      requestAnimationFrame(gameLoop);
    }

    // Initialisation
    paddleLeft.style.top = `${paddleLeftPosY}px`;
    paddleRight.style.top = `${paddleRightPosY}px`;
    updateScore();
    resetBall();
    gameLoop();
  </script>
</body>
</html>
